<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc nghiệm Vật lí nhiệt - Thi đấu</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; text-align: center; }
        .card { background: white; max-width: 400px; margin: 30px auto; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 12px; margin: 10px 0; font-size: 16px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .option-btn { background: #28a745; margin: 8px 0; font-weight: bold; }
        .option-btn:hover { background: #218838; }
        .spectator { background: #ffc107; color: black; padding: 10px; font-weight: bold; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="card" id="login-screen">
        <h2>Thi Đấu Vật Lí Nhiệt</h2>
        <input type="text" id="username" placeholder="Nhập họ và tên của bạn...">
        <button onclick="joinGame()">Vào Phòng Chờ</button>
    </div>

    <div class="card" id="waiting-screen" style="display:none;">
        <h3>Đã vào phòng chờ!</h3>
        <p>Xin chào <span id="display-name" style="font-weight:bold;"></span></p>
        <p>Đang chờ Ban tổ chức bắt đầu trò chơi...</p>
    </div>

    <div class="card" id="game-screen" style="display:none;">
        <h4 id="question-counter">Câu hỏi</h4>
        <p id="timer" style="font-weight:bold; color:red; font-size: 18px;">Thời gian: 30s</p>
        <p id="question-text" style="font-weight: bold; text-align: left;"></p>
        <div id="options-container"></div>
    </div>

    <div class="card" id="status-screen" style="display:none;">
        <h3 id="status-title">Thông báo vòng đấu</h3>
        <p id="status-message"></p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myName = '';
        let timerInterval;

        function joinGame() {
            myName = document.getElementById('username').value.trim();
            if (!myName) {
                alert('Vui lòng nhập tên của bạn!');
                return;
            }
            socket.emit('join-game', { name: myName });
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('waiting-screen').style.display = 'block';
            document.getElementById('display-name').innerText = myName;
        }

        socket.on('new-question', (data) => {
            document.getElementById('waiting-screen').style.display = 'none';
            document.getElementById('status-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';

            document.getElementById('question-counter').innerText = `Câu hỏi ${data.questionIndex + 1} / ${data.totalQuestions}`;
            document.getElementById('question-text').innerText = data.questionText;

            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            const labels = ['A', 'B', 'C', 'D'];
            data.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = `${labels[index]}. ${opt}`;
                btn.onclick = () => submitAnswer(labels[index]);
                container.appendChild(btn);
            });

            let timeLeft = data.duration;
            document.getElementById('timer').innerText = `Thời gian: ${timeLeft}s`;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = `Thời gian: ${timeLeft}s`;
                if (timeLeft <= 0) clearInterval(timerInterval);
            }, 1000);
        });

        function submitAnswer(answerKey) {
            socket.emit('submit-answer', { answer: answerKey });
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(b => b.disabled = true);
            document.getElementById('question-text').innerText += "\n\n[Đã gửi đáp án thành công, đang chờ kết quả...]";
        }

        socket.on('player-status-update', (data) => {
            clearInterval(timerInterval);
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('status-screen').style.display = 'block';

            if (data.status === 'SPECTATOR') {
                document.getElementById('status-title').innerText = "Chế độ theo dõi (Spectator)";
                document.getElementById('status-message').className = 'spectator';
            } else {
                document.getElementById('status-title').innerText = "Vượt qua vòng này!";
            }
            document.getElementById('status-message').innerText = data.message;
        });

        socket.on('round-result', (data) => {
            if (data.isFinished && data.champion) {
                document.getElementById('status-title').innerText = "🏆 QUÂN QUÂN LỘ DIỆN! 🏆";
                document.getElementById('status-message').innerText = `Xin chúc mừng người chiến thắng: ${data.champion}`;
                document.getElementById('status-screen').style.display = 'block';
            }
        });
    </script>
</body>
</html>
